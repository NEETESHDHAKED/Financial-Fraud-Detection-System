<!DOCTYPE html>
<html><head><title>Fraud Detector</title>
<style>body{font-family:Arial;background:#0f172a;color:white;display:flex;justify-content:center;padding:40px} .card{background:#1e293b;padding:25px;border-radius:15px;width:380px} input{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:none} button{width:100%;padding:12px;background:#22c55e;border:none;border-radius:10px;font-weight:bold;cursor:pointer} a{color:#60a5fa}</style>
</head><body>
<div class="card">
<h2>💳 Fraud Detector</h2>
<p>Hi {{user.username}} | <a href="/history/">History</a> | <a href="/logout/">Logout</a></p>
<form method="POST">{% csrf_token %}
<label>Amount</label><input type="number" step="0.01" name="amount" required>
<button type="submit">Submit</button>
</form>
{% if result %}
<hr>
<h3>Result: {{result}}</h3>
<p>Risk Score: {{risk}} - {{status}}</p>
{% endif %}
<p style="font-size:12px;opacity:.7">Risk Analysis complete based on Amount patterns.</p>
</div></body></html>
