<!DOCTYPE html><html><head><style>body{background:#0f172a;color:white;font-family:Arial;padding:30px} table{width:100%;background:#1e293b;border-radius:10px} td,th{padding:10px;border-bottom:1px solid #334155} a{color:#60a5fa}</style></head>
<body><h2>History - {{user.username}}</h2><a href="/">Back to Home</a><br><br>
<table><tr><th>Amount</th><th>Result</th><th>Risk</th><th>Date</th></tr>
{% for r in rows %}<tr><td>{{r.amount}}</td><td>{{r.result}}</td><td>{{r.risk_score|floatformat:2}}</td><td>{{r.created_at}}</td></tr>{% endfor %}
</table></body></html>
