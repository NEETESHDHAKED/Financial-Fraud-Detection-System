<body><div class="card"><h2>Register</h2><form method="POST">{% csrf_token %}<input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>Create Account</button></form><p><a href="/login/">Have account? Login</a></p></div></body></html>
